description: 'Mensa Brands (now operating as BRND.ME) is a Bangalore, India based "house
  of brands" / digital-first brand aggregator founded in 2021 by Ananth Narayanan.
  Following the Thrasio model, it acquires, operates and scales digital-native consumer
  brands across fashion, beauty, personal care, home and general merchandise, selling
  through marketplaces such as Amazon, Flipkart and Myntra as well as direct-to-consumer
  channels. The company reached unicorn status in 2021 and is backed by investors including
  Norwest Venture Partners, Accel, Prosus Ventures, Tiger Global and Alpha Wave. Its
  original domain mensabrands.com now redirects to brndme.in. This is a consumer-brands
  operating company; enrichment found no public developer or API surface (no docs/developer/api
  subdomains, no /.well-known documents, no llms.txt) beyond the marketing site''s
  WordPress CMS, so no API artifacts were produced.'
